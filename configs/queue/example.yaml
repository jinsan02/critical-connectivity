# 대기열 예시 — scripts/run_queue.py. run_id 는 phase · exp · 설정으로 만든다 (src/training/ledger.py).
# 이 예시의 run_id: p0_r1_r1_base_i0mxo0, p0_r1_r1_base_i1mxo0
defaults:
  phase: p0
  exp: r1
  data: configs/data/r1_add113.yaml
  train: configs/train/r1.yaml
jobs:
  - model: configs/model/r1.yaml
    set: {train.init_seed: 0}
  - model: configs/model/r1.yaml
    set: {train.init_seed: 1}
