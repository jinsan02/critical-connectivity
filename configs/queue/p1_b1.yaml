# P1 (기획서 §15.1 · §12A-4): 아키텍처마다 같은 12회 — lr {1e-4, 3e-4, 1e-3} × wd {0.1, 1.0} × init {0.02, 1/√d}
# 데이터 D01(add97, Train 40%) · 배치 256 · S_max 100K · Validation 으로만 조율. 설계: docs/p1-pilot.md
# h01~h06: init 0.02, h07~h12: init 1/√d_model. 각 6개 안에서 wd 0.1 → 1.0, lr 1e-4 → 3e-4 → 1e-3
# 1단계: B-1 Dense-8M 12회 (약 1시간). Grokking 이 나오는지 보고 p1_rest.yaml 을 시작한다
defaults:
  phase: p1
  exp: exp01
  data: configs/data/add97.yaml
  train: configs/train/base.yaml
jobs:
  - {model: configs/model/dense_8m.yaml, variant: h01, set: {train.lr: 1.0e-4, train.weight_decay: 0.1, model.init_std: 0.02}}
  - {model: configs/model/dense_8m.yaml, variant: h02, set: {train.lr: 3.0e-4, train.weight_decay: 0.1, model.init_std: 0.02}}
  - {model: configs/model/dense_8m.yaml, variant: h03, set: {train.lr: 1.0e-3, train.weight_decay: 0.1, model.init_std: 0.02}}
  - {model: configs/model/dense_8m.yaml, variant: h04, set: {train.lr: 1.0e-4, train.weight_decay: 1.0, model.init_std: 0.02}}
  - {model: configs/model/dense_8m.yaml, variant: h05, set: {train.lr: 3.0e-4, train.weight_decay: 1.0, model.init_std: 0.02}}
  - {model: configs/model/dense_8m.yaml, variant: h06, set: {train.lr: 1.0e-3, train.weight_decay: 1.0, model.init_std: 0.02}}
  - {model: configs/model/dense_8m.yaml, variant: h07, set: {train.lr: 1.0e-4, train.weight_decay: 0.1, model.init_std: 0.0589}}
  - {model: configs/model/dense_8m.yaml, variant: h08, set: {train.lr: 3.0e-4, train.weight_decay: 0.1, model.init_std: 0.0589}}
  - {model: configs/model/dense_8m.yaml, variant: h09, set: {train.lr: 1.0e-3, train.weight_decay: 0.1, model.init_std: 0.0589}}
  - {model: configs/model/dense_8m.yaml, variant: h10, set: {train.lr: 1.0e-4, train.weight_decay: 1.0, model.init_std: 0.0589}}
  - {model: configs/model/dense_8m.yaml, variant: h11, set: {train.lr: 3.0e-4, train.weight_decay: 1.0, model.init_std: 0.0589}}
  - {model: configs/model/dense_8m.yaml, variant: h12, set: {train.lr: 1.0e-3, train.weight_decay: 1.0, model.init_std: 0.0589}}
