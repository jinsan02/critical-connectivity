# 기본 학습 설정 — 기획서 v0.6 §14 초기 학습 설정 (파일럿 초기값, Gate 2.5 에서 확정)
lr: 3.0e-4
weight_decay: 0.1
betas: [0.9, 0.999] # 기획서에 없음 — PyTorch 기본값
batch_size: 256
s_max: 100000 # §12B-5 최소 100K (R1 Grokking 스텝의 5배 이상으로 Gate 2.5 에서 확정)
eval_every: 100
grad_clip: 1.0
eval_split: val
ckpt_every: 5000 # 재개용 체크포인트 덮어쓰기 간격 (§15.2)
init_seed: 0
order_seed: 0
cuda_graph: true
early_stop: # §10.2 + 조기 종료 (STATE 결정 2026-11-27)
  enabled: true
  grok_acc: 0.95
  hold_acc: 0.90
  min_window: 5000
  rel_window: 0.5
  post_grok_steps: 20000 # §12B-3 T_grok+5K · +20K 관측
  max_window: 20000 # 지속 창 상한 (Gate 2.5 결정 2026-11-28, P2 부터)
  confirm_extension: 20000 # S_max 에서 확인 중인 후보를 창 끝까지 더 본다 (최대 +20K)
snapshots: # 학습 중간 가중치 8개 — 나중 분석용 (STATE 2026-11-27, 사람 결정)
  steps: [1000, 2000, 5000, 10000, 20000, 50000] # 로그 간격 6개
  rise_acc: 0.5 # 평가 정확도가 처음 50% 를 넘는 스텝 (Grokking 직전)
  after_candidate: 5000 # Grokking 후보 + 5K (§12B-3)
